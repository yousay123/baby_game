<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>蜜糖生活 · 3D</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <header class="top-bar">
      <div class="brand">
        <h1>蜜糖生活</h1>
        <p id="sceneSubtitle">3D 温馨日常</p>
      </div>
      <nav class="scene-nav" id="sceneNav">
        <button type="button" data-scene="makeup">化妆屋</button>
        <button type="button" data-scene="market">超市</button>
        <button type="button" data-scene="home">客厅</button>
        <button type="button" data-scene="kitchen">厨房</button>
        <button type="button" data-scene="dining">餐厅</button>
      </nav>
      <div class="wallet">钱包 ¥<span id="walletMoney">10000</span>
        <small id="walletHint">领零花钱·做家务·做饭可赚钱</small>
      </div>
    </header>

    <div class="virtual-stick" id="virtualStick" hidden aria-hidden="true">
      <div class="virtual-stick-base">
        <div class="virtual-stick-knob"></div>
      </div>
      <span class="virtual-stick-label">移动</span>
    </div>

    <aside class="hud-panel hud-collapsed" id="hudPanel">
      <button type="button" class="hud-toggle" id="hudToggle" aria-label="展开物品栏">物品</button>
      <div class="hud-body" id="hudBody">
        <div class="hud-card" id="questCard">
          <strong id="questTitle">任务</strong>
          <p id="questText">先化个美美的妆，再去超市买菜～</p>
          <ul id="guideSteps" class="inv-list guide-steps" hidden></ul>
        </div>
        <div class="hud-card" id="invCard">
          <strong id="invTitle">物品</strong>
          <ul id="invList" class="inv-list"></ul>
        </div>
        <div class="hud-actions" id="hudActions"></div>
      </div>
    </aside>

    <div class="makeup-2d" id="makeup2d" hidden></div>

    <div class="makeup-panel" id="makeupPanel" hidden>
      <div class="makeup-panel-head">
        <strong id="makeupPanelTitle">蜜糖化妆台</strong>
        <span class="makeup-tip" id="makeupSectionHint">点选后立即生效</span>
      </div>
      <nav class="makeup-nav" id="makeupNav" aria-label="化妆屋导航">
        <button type="button" data-section="model">角色</button>
        <button type="button" data-section="style">风格</button>
        <button type="button" data-section="makeup" class="active">化妆</button>
        <button type="button" data-section="dress">换装</button>
        <button type="button" data-section="bg">背景</button>
      </nav>
      <div class="makeup-subnav" id="makeupTabs" hidden></div>
      <div class="makeup-options" id="makeupOptions"></div>
      <button type="button" class="btn btn-coral" id="btnFinishMakeup">化好妆去超市</button>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button>
        <h3 id="modalTitle">提示</h3>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
